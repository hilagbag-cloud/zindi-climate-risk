name: Evaluate Model

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training, GroupKFold CV evaluation & submission generation
        run: |
          python src/train.py --model ensemble --folds 5

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zindi-submission-and-experiments
          path: |
            submission/
            experiments.csv
            experiments.log
